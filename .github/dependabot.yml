# Dependabot config: scheduled dep updates across all three of our
# dependency ecosystems (Go server, npm webapp, GitHub Actions).
# PRs land on Monday mornings so weekly review is predictable;
# max 5 open PRs per ecosystem to avoid swamping review capacity.
#
# Security updates (separate from these version updates) are enabled at
# the repo level — those fire immediately when GHSA publishes a new
# advisory affecting a pinned dep, regardless of this schedule.

version: 2
updates:
  # Go module — the server binary. Includes transitive deps so the
  # full security surface is tracked.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      # No `include: scope` — the prefix already carries the ecosystem
      # scope "(go)". Adding include:scope appends the dependency-type
      # scope too, producing "deps(go)(deps):" — a double-scope that
      # isn't valid Conventional Commit syntax, so release-please can't
      # parse it and drops the bump from the changelog.
      prefix: "deps(go)"
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  # npm — the React webapp. Group by patch-vs-minor to reduce PR churn.
  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      # No `include: scope` — see the go entry above. "deps(npm)" already
      # scopes the ecosystem; include:scope would make "deps(npm)(deps-dev):"
      # which release-please skips (that's why the eslint 10 bump never
      # landed in the v0.2.0 changelog).
      prefix: "deps(npm)"
    # Hold webapp-toolchain majors that broke the build and aren't yet
    # supported by the surrounding ecosystem. Revisit these together when
    # the ecosystem catches up (fix-forward toolchain migration):
    #   - typescript 7 (native "tsgo"): removes tsconfig options we use and
    #     isn't supported by @typescript-eslint.
    #   - eslint 10: no eslint-plugin-react release supports it.
    #   - @babel/* 8 + babel-loader 10: ESM-only @babel/core breaks
    #     babel-loader's require().
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "babel-loader"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      # Dev dependencies (linters, test tooling, build tools) change
      # often but rarely affect runtime — bundle them separately.
      npm-dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions used by .github/workflows/*.yml. Keeps action SHAs
  # current — important because we pin all actions to SHAs (security),
  # which means we don't get automatic updates the way @v4 tag users do.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
