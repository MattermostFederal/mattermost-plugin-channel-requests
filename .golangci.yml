version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - modernize
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unqueryvet
    - unused
    - whitespace
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
    unqueryvet:
      check-sql-builders: true
  exclusions:
    # Don't lint third-party Go files vendored inside the webapp's npm
    # tree. CI doesn't run `npm install` for the lint job so these never
    # appear there, but a local run after `npm install` would otherwise
    # flag them.
    paths:
      - webapp/node_modules
    rules:
      - path: server/configuration.go
        linters:
          - unused
      - path: _test\.go
        linters:
          - bodyclose
      # build/ is vendored tooling from mattermost-plugin-starter-template
      # (pluginctl deploy client, manifest generator). Its gosec findings
      # (SSRF/log-injection in a local CLI) are not ours to fix.
      - path: build/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: interface{}
          replacement: any
    goimports:
      local-prefixes:
        - github.com/MattermostFederal/mattermost-plugin-channel-requests
